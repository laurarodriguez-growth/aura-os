name: Deploy Aura OS to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar pnpm fijado
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Instalar dependencias reproducibles
        run: pnpm install --frozen-lockfile

      - name: Construir Aura OS
        run: pnpm run build

      - name: Preparar archivos de GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Publicar Aura OS
        id: deployment
        uses: actions/deploy-pages@v4
