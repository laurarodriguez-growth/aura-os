name: Validate Aura OS

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Activar pnpm fijado
        run: corepack enable && corepack prepare pnpm@9.15.9 --activate
      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile
      - name: Compilar frontend
        run: pnpm run build

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-lock.txt
      - name: Instalar dependencias
        run: pip install -r requirements-lock.txt -r requirements-dev.txt
      - name: Validar backend
        run: python -m compileall -q app && pytest -q tests
