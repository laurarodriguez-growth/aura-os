services:
  - type: web
    name: aura-grow-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: ./start.sh
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: APP_NAME
        value: Aura Grow API
      - key: ENVIRONMENT
        value: production
      - key: GOOGLE_CACHE_DAYS
        value: 30
      - key: WEBSITE_CACHE_DAYS
        value: 30
      - key: WEBSITE_TIMEOUT_SECONDS
        value: 9
      - key: AUDIT_BATCH_SIZE
        value: 2
      - key: MAX_API_BUDGET_PER_JOB
        value: 60
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
